<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attention, step by step</title>
<link rel="stylesheet" href="common.css">
<style>
.stages { display:flex; gap:0; }
.stages button { border-radius:0; margin-left:-1px; font-size:22px; padding:8px 18px; }
.stages button:first-child { border-radius:6px 0 0 6px; }
.stages button:last-child { border-radius:0 6px 6px 0; }
.toks { display:flex; gap:10px; margin:0 0 14px; font-size:22px; color:var(--gray); align-items:center; }
.toks span.t { border:1px solid var(--dim); border-radius:4px; padding:2px 12px; color:var(--black); }
</style>
</head>
<body>
<div class="controls">
  <button id="prev" type="button">◀ Back</button>
  <button id="next" class="primary" type="button">Next ▶</button>
  <div class="stages" id="stages"></div>
</div>
<p class="caption" id="caption"></p>
<div id="view"></div>
<div class="calc" id="calc"></div>
<p class="tip">Hover any cell of the result to see where it comes from. Toy sizes: n = 4 tokens, d<sub>k</sub> = 4, one head.</p>
<script src="lib.js"></script>
<script>
const randn=makeRandn(7);
const TOK=["the","cat","sat","on"];
const DK=["d0","d1","d2","d3"];
const rnd=(r,c,s)=>Array.from({length:r},()=>Array.from({length:c},()=>+(randn()*s).toFixed(2)));
const Q=rnd(4,4,0.9),K=rnd(4,4,0.9),V=rnd(4,4,0.8);
const S=mapM(matmul(Q,T(K)),v=>v/2);
const Sm=mapM(S,(v,i,j)=>j>i?-Infinity:v);
const P=Sm.map(softmaxRow);
const O=matmul(P,V);

const STAGES=[
  {k:"qkv",t:"Q, K, V",cap:"Every token arrives with three vectors, made by multiplying its embedding with three learned weight matrices. <b>Query</b>: what this token is looking for. <b>Key</b>: what it offers. <b>Value</b>: what it hands over."},
  {k:"s",t:"1  scores",cap:"<b>S = Q·Kᵀ / √d<sub>k</sub></b>. Entry (i, j) is the dot product of token i's query with token j's key: how relevant token j is to token i. This is the only [n × n] matrix in the model."},
  {k:"m",t:"2  mask",cap:"<b>Causal mask</b>: a decoder may not look at later tokens, so every score above the diagonal becomes −∞. It costs nothing: it is a comparison of row and column indices."},
  {k:"p",t:"3  softmax",cap:"<b>P = softmax(S′)</b> row by row: subtract the row max, exponentiate, divide by the row sum. Each row of P is a probability distribution. It needs the <b>whole row</b> before it can finish."},
  {k:"o",t:"4  P·V",cap:"<b>O = P·V</b>. Output row i is a weighted average of the value vectors, weighted by row i of P. This is where information moves between tokens."}
];
let stage=0;
const view=$("#view"),calc=$("#calc");

function mm(A,B,Cm,oa,ob,oc,post,start){
  const row=el("div","row");
  const fa=matEl(A,oa),fb=matEl(B,ob),fc=matEl(Cm,{...oc,active:true});
  row.append(fa,el("span","op","×"),fb,el("span","op","="),fc);
  view.appendChild(row);
  const raw=matmul(A,B);
  const show=(i,j)=>{
    clearHL(row);
    cellsOf(fa).forEach(c=>{if(+c.dataset.r===i)c.classList.add("hl");});
    cellsOf(fb).forEach(c=>{if(+c.dataset.c===j)c.classList.add("hl");});
    cellsOf(fc).forEach(c=>{if(+c.dataset.r===i&&+c.dataset.c===j)c.classList.add("sel");});
    const terms=A[i].map((a,k)=>`${fmt(a)}×${fmt(B[k][j])}`).join(" + ");
    let s=`<b>${oc.name}[${oc.rl[i]}, ${oc.cl[j]}]</b> = row ${i} of ${oa.name} · column ${j} of ${ob.name}<br>= ${terms}<br>= <b>${fmt(raw[i][j])}</b>`;
    if(post)s+=` ${post} = <b>${fmt(Cm[i][j])}</b>`;
    s+=`<br><span class="h">${A[0].length} multiply-adds per cell × ${Cm.length*Cm[0].length} cells</span>`;
    calc.innerHTML=s;
  };
  bindActive(fc,show);show(...start);
}
function ew(A,oa,Bm,ob,label,explain,start,rowwise){
  const row=el("div","row");
  const fa=matEl(A,oa),fb=matEl(Bm,{...ob,active:true});
  row.append(fa,el("span","op",label),fb);
  view.appendChild(row);
  const show=(i,j)=>{
    clearHL(row);
    cellsOf(fa).forEach(c=>{const r=+c.dataset.r,cc=+c.dataset.c;if(rowwise?r===i:(r===i&&cc===j))c.classList.add("hl");});
    cellsOf(fb).forEach(c=>{if(+c.dataset.r===i&&+c.dataset.c===j)c.classList.add("sel");});
    calc.innerHTML=explain(i,j);
  };
  bindActive(fb,show);show(...start);
}

function render(){
  view.innerHTML="";
  const st=STAGES[stage];
  $("#caption").innerHTML=st.cap;
  $$("#stages button").forEach((b,i)=>b.setAttribute("aria-pressed",i===stage));
  $("#prev").disabled=stage===0;$("#next").disabled=stage===STAGES.length-1;
  const toks=el("div","toks",`tokens: ${TOK.map((t,i)=>`<span class="t">${i} ${t}</span>`).join("")}`);
  view.appendChild(toks);
  if(st.k==="qkv"){
    const row=el("div","row");
    row.append(matEl(Q,{name:"Q",kind:"q",rl:TOK,cl:DK}),matEl(K,{name:"K",kind:"k",rl:TOK,cl:DK}),matEl(V,{name:"V",kind:"v",rl:TOK,cl:DK}));
    view.appendChild(row);
    calc.innerHTML=`Q = X·W<sub>q</sub>   K = X·W<sub>k</sub>   V = X·W<sub>v</sub>     <span class="h">[n × d] · [d × d<sub>k</sub>] → [n × d<sub>k</sub>], one row per token</span><br><span class="h">Each row depends only on its own token: no token has looked at any other token yet.</span>`;
  }else if(st.k==="s"){
    mm(Q,T(K),S,{name:"Q",kind:"q",rl:TOK,cl:DK},{name:"Kᵀ",kind:"k",rl:DK,cl:TOK},{name:"S",kind:"x",rl:TOK,cl:TOK},"÷ √4",[3,1]);
  }else if(st.k==="m"){
    ew(S,{name:"S",kind:"x",rl:TOK,cl:TOK},Sm,{name:"S′",kind:"x",rl:TOK,cl:TOK},"→ mask →",
      (i,j)=>j>i?`<b>S′[${TOK[i]}, ${TOK[j]}]</b> = −∞<br><span class="h">"${TOK[j]}" (position ${j}) comes after "${TOK[i]}" (position ${i}): hidden</span>`
               :`<b>S′[${TOK[i]}, ${TOK[j]}]</b> = S[${TOK[i]}, ${TOK[j]}] = <b>${fmt(Sm[i][j])}</b><br><span class="h">position ${j} ≤ ${i}: visible</span>`,[0,2]);
  }else if(st.k==="p"){
    ew(Sm,{name:"S′",kind:"x",rl:TOK,cl:TOK},P,{name:"P",kind:"p",prob:true,rl:TOK,cl:TOK},"→ softmax →",(i,j)=>{
      const r=Sm[i],m=Math.max(...r),ex=r.map(x=>x===-Infinity?0:Math.exp(x-m)),s=ex.reduce((a,b)=>a+b,0);
      return `row "${TOK[i]}":  max = <b>${fmt(m)}</b>   exp(S′ − max) = [${ex.map(x=>fmt(x)).join(", ")}]   sum = <b>${fmt(s,3)}</b><br><b>P[${TOK[i]}, ${TOK[j]}]</b> = ${fmt(ex[j])} / ${fmt(s,3)} = <b>${fmt(P[i][j],3)}</b><br><span class="h">three passes over the row: max, then sum of exponentials, then divide</span>`;},[3,1],true);
  }else{
    mm(P,V,O,{name:"P",kind:"p",prob:true,rl:TOK,cl:TOK},{name:"V",kind:"v",rl:TOK,cl:DK},{name:"O",kind:"x",rl:TOK,cl:DK},null,[3,0]);
  }
}
STAGES.forEach((s,i)=>{const b=el("button","",s.t);b.type="button";b.onclick=()=>{stage=i;render();};$("#stages").appendChild(b);});
$("#prev").onclick=()=>{if(stage>0){stage--;render();}};
$("#next").onclick=()=>{if(stage<STAGES.length-1){stage++;render();}};
render();
autoStep($("#next"));
</script>
</body>
</html>
