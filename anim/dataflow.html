<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attention dataflow through HBM</title>
<link rel="stylesheet" href="common.css">
<style>
.controls button { padding:8px 15px; font-size:22px; }
.strip { display:flex; gap:10px; margin:6px 0 18px; align-items:stretch; }
.kern { flex:1; border:2px solid var(--dim); border-radius:8px; padding:8px 12px; font-size:21px; background:#fff; transition:all .25s; min-width:0; }
.kern b { display:block; font-size:22px; }
.kern span { font-family:Monaco,"Courier New",monospace; font-size:14px; color:var(--gray); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kern.done { background:#F6F6F6; color:var(--gray); }
.kern.cur { border-color:var(--title-red); box-shadow:0 0 0 2px var(--title-red); }
.panels { display:grid; grid-template-columns:1fr 380px 1fr; gap:0; align-items:stretch; }
.panel { border:2px solid var(--dim); border-radius:10px; padding:14px 18px; min-height:300px; }
.panel h4 { margin:0 0 10px; font-size:24px; font-weight:normal; color:var(--title-red); }
.panel h4 span { color:var(--gray); font-size:20px; margin-left:8px; }
.tens { display:flex; flex-wrap:wrap; gap:10px; }
.t { border-radius:6px; padding:6px 12px; font-size:21px; border:2px solid transparent; background:var(--cell); transition:all .25s; }
.t i { font-style:normal; color:var(--gray); font-size:18px; margin-left:6px; font-family:Monaco,"Courier New",monospace; }
.t.big { background:#F6DCDB; }
.t.r { border-color:var(--k); }
.t.w { border-color:var(--title-red); box-shadow:0 0 0 2px var(--title-red); }
.t.gone { opacity:.25; text-decoration:line-through; }
.mid { display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; font-size:21px; color:var(--gray); padding:0 10px; text-align:center; }
.arrow { font-size:22px; padding:6px 10px; border-radius:6px; width:100%; }
.arrow.rd { color:var(--k); }
.arrow.wr { color:var(--title-red); }
.arrow b { font-family:Monaco,"Courier New",monospace; font-weight:normal; font-size:22px; }
.chip-list { font-size:22px; line-height:1.6; }
.stats { display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:24px; margin-top:20px; align-items:start; }
.barbox { font-size:21px; }
.track { height:30px; background:var(--cell); border-radius:4px; display:flex; overflow:hidden; margin:6px 0; }
.track div { height:100%; transition:width .3s; }
.sm { background:var(--q); } .bg { background:var(--hbm); }
.num { font-family:Monaco,"Courier New",monospace; font-size:30px; display:block; }
.lab { color:var(--gray); font-size:20px; }
.key { display:inline-flex; align-items:center; gap:6px; margin-right:18px; color:var(--gray); font-size:19px; }
.key i { width:16px; height:16px; border-radius:3px; display:inline-block; }
</style>
</head>
<body>
<div class="controls">
  <div class="seg" id="mode"></div>
  <span class="lab">n =</span>
  <div class="seg" id="nseg"></div>
  <button id="reset" type="button">Reset</button>
  <button id="step" class="primary" type="button">Next kernel ▶</button>
</div>
<p class="caption" id="caption"></p>
<div class="strip" id="strip"></div>
<div class="panels">
  <div class="panel"><h4>HBM <span>(GDDR6X on the 4090: 24 GB, 1.0 TB/s)</span></h4><div class="tens" id="hbm"></div></div>
  <div class="mid" id="mid"></div>
  <div class="panel"><h4>On chip <span>(registers + 128 KB shared memory per SM)</span></h4><div class="chip-list" id="chip"></div></div>
</div>
<div class="stats">
  <div class="barbox">
    <div><span class="key"><i class="sm"></i>Q, K, V, O traffic</span><span class="key"><i class="bg"></i>n × n traffic (S, P and copies)</span></div>
    <div class="track"><div class="sm" id="bsm"></div><div class="bg" id="bbg"></div></div>
    <div id="btxt" class="lab"></div>
  </div>
  <div><span class="num" id="tmin"></span><span class="lab">HBM bytes ÷ 1.0 TB/s<br>(lower bound for traffic so far)</span></div>
  <div><span class="num" id="tmeas"></span><span class="lab" id="tmeasl"></span></div>
</div>
<script src="lib.js"></script>
<script>
const H=32,D=128,BW=1.008e12;
/* measured on the RTX 4090, flash_attention/attention_bench.py (ms, fp16, causal) */
const MEAS={eager:{1024:0.758,2048:3.072,4096:12.275,8192:49.020,16384:null},
            compiled:{1024:0.307,2048:1.304,4096:5.481,8192:21.662,16384:null},
            flash:{1024:0.107,2048:0.309,4096:1.049,8192:3.697,16384:14.695}};
const MODES={
  eager:{t:"Eager PyTorch",cap:"Eager mode: each line of the Python function is its own kernel. Every intermediate is a full <b>[h × n × n]</b> tensor written to HBM and read back by the next kernel.",
    ks:[{n:"Q·Kᵀ",k:"ampere_fp16_s1688gemm_fp16_128x128…",r:["Q","K"],w:["S"],chip:"tensor-core GEMM, one tile of S at a time"},
        {n:"÷ √d",k:"vectorized_elementwise_kernel<BUnaryFunctor>",r:["S"],w:["S1"],f:["S"],chip:"one multiply per element"},
        {n:"copy",k:"Memcpy DtoD",r:["S1"],w:["S2"],chip:"masked_fill is out-of-place: copy first"},
        {n:"mask",k:"elementwise_kernel (masked_fill_)",r:["S2","mask"],w:["S2"],f:["S1"],chip:"one compare + select per element"},
        {n:"softmax",k:"softmax_warp_forward",r:["S2"],w:["P"],f:["S2"],chip:"row max, row sum of exp, divide"},
        {n:"P·V",k:"cutlass_80_tensorop_f16_s16816gemm…",r:["P","V"],w:["O"],f:["P"],chip:"tensor-core GEMM"}]},
  compiled:{t:"torch.compile",cap:"Inductor fuses scale, mask and softmax into <b>one Triton kernel</b>. Two n × n passes disappear, but the two GEMMs are separate library calls, so S and P still go through HBM.",
    ks:[{n:"Q·Kᵀ",k:"ampere_fp16_s1688gemm_fp16_128x128…",r:["Q","K"],w:["S"],chip:"tensor-core GEMM (cuBLAS)"},
        {n:"÷√d, mask, softmax",k:"triton_red_fused__softmax_div_masked_fill…",r:["S","mask"],w:["P"],f:["S"],chip:"one generated Triton kernel: scale, mask and softmax per row, in registers"},
        {n:"P·V",k:"cutlass_80_tensorop_f16_s16816gemm…",r:["P","V"],w:["O"],f:["P"],chip:"tensor-core GEMM (CUTLASS)"}]},
  flash:{t:"FlashAttention",cap:"<b>One kernel.</b> Q, K and V are read in tiles; scores, mask, softmax and P·V all happen on chip. Nothing of size n × n ever reaches HBM.",
    ks:[{n:"attention (fused)",k:"pytorch_flash::flash_fwd_kernel<128, 64, 64, 4…>",r:["Q","K","V"],w:["O","lse"],chip:"per 64-row tile of Q: stream 64-row tiles of K and V, Q·Kᵀ → mask → online softmax → ·V, all in registers and shared memory"}]}
};
const ST={mode:"eager",n:8192,step:0};
function sizes(n){const sm=n*H*D*2,bg=H*n*n*2;return{Q:sm,K:sm,V:sm,O:sm,S:bg,S1:bg,S2:bg,P:bg,mask:n*n,lse:H*n*4};}
const BIG=new Set(["S","S1","S2","P","mask"]);
const NAME={S:"S",S1:"S ÷ √d",S2:"S′ (masked)",P:"P",Q:"Q",K:"K",V:"V",O:"O",mask:"mask",lse:"logsumexp"};
function bytes(b){if(b>=1e9)return(b/1e9).toFixed(b>=1e10?1:2)+" GB";if(b>=1e6)return(b/1e6).toFixed(b>=1e7?0:1)+" MB";return(b/1e3).toFixed(0)+" kB";}
function tms(s){return s>=1e-3?(s*1e3).toFixed(s>=1e-2?1:2)+" ms":(s*1e6).toFixed(0)+" µs";}

function render(){
  const m=MODES[ST.mode],sz=sizes(ST.n),ks=m.ks;
  $$("#mode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===ST.mode));
  $$("#nseg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.v===ST.n));
  $("#caption").innerHTML=m.cap;
  $("#strip").innerHTML=ks.map((k,i)=>`<div class="kern${i<ST.step-1?" done":""}${i===ST.step-1?" cur":""}"><b>${i+1}. ${k.n}</b><span>${esc(k.k)}</span></div>`).join("");
  // live tensors after running ST.step kernels
  const live=new Map([["Q",1],["K",1],["V",1]]);if(ST.mode!=="flash")live.set("mask",1);
  const gone=new Set();let small=0,big=0,peak=0;
  for(let i=0;i<ST.step;i++){const k=ks[i];
    for(const t of k.r){(BIG.has(t)?big+=sz[t]:small+=sz[t]);}
    for(const t of k.w){(BIG.has(t)?big+=sz[t]:small+=sz[t]);live.set(t,1);gone.delete(t);}
    let cur=0;for(const t of live.keys())if(!["Q","K","V","mask"].includes(t))cur+=sz[t];peak=Math.max(peak,cur);
    for(const t of (k.f||[])){live.delete(t);gone.add(t);}
  }
  const cur=ST.step?ks[ST.step-1]:null;
  const order=["Q","K","V","mask","S","S1","S2","P","O","lse"];
  $("#hbm").innerHTML=order.filter(t=>live.has(t)||gone.has(t)).map(t=>{
    let c="t"+(BIG.has(t)&&t!=="mask"?" big":"");
    if(cur&&cur.w.includes(t))c+=" w";else if(cur&&cur.r.includes(t))c+=" r";
    if(gone.has(t)&&!(cur&&(cur.r.includes(t))))c+=" gone";
    return `<span class="${c}">${NAME[t]}<i>${bytes(sz[t])}</i></span>`;}).join("");
  $("#mid").innerHTML=cur?`<div class="arrow rd">read →<br><b>${bytes(cur.r.reduce((a,t)=>a+sz[t],0))}</b></div><div class="arrow wr">← write<br><b>${bytes(cur.w.reduce((a,t)=>a+sz[t],0))}</b></div>`
    :`<div>press <b style="color:var(--title-red);font-weight:normal">Next kernel</b></div>`;
  $("#chip").innerHTML=cur?`<b>kernel ${ST.step}: ${cur.n}</b><br>${cur.chip}`:"idle";
  const tot=small+big,full=Math.max(1,ks.reduce((a,k)=>a+[...k.r,...k.w].reduce((s,t)=>s+sz[t],0),0));
  // scale bar to the eager total at this n so the three modes are comparable
  const ref=MODES.eager.ks.reduce((a,k)=>a+[...k.r,...k.w].reduce((s,t)=>s+sz[t],0),0);
  $("#bsm").style.width=(small/ref*100)+"%";$("#bbg").style.width=(big/ref*100)+"%";
  $("#btxt").innerHTML=`moved so far: <b style="color:#000;font-weight:normal">${bytes(tot)}</b> (${bytes(small)} Q/K/V/O + ${bytes(big)} n × n)   ·   bar width = eager total at this n`;
  $("#tmin").textContent=tms(tot/BW);
  const meas=MEAS[ST.mode][ST.n];
  if(ST.step===ks.length){
    $("#tmeas").textContent=meas==null?"out of memory":meas.toFixed(meas<1?3:1)+" ms";
    $("#tmeasl").innerHTML=meas==null?`peak would need ${bytes(peak+3*sz.Q)}: more than 24 GB`:"measured on the 4090<br>(whole forward call)";
  }else{$("#tmeas").textContent="–";$("#tmeasl").innerHTML="measured time appears<br>after the last kernel";}
  $("#step").disabled=ST.step>=ks.length;
}
Object.entries(MODES).forEach(([k,m])=>{const b=el("button","",m.t);b.type="button";b.dataset.v=k;b.onclick=()=>{ST.mode=k;ST.step=0;render();};$("#mode").appendChild(b);});
[1024,2048,4096,8192,16384].forEach(n=>{const b=el("button","",n.toLocaleString("en-US"));b.type="button";b.dataset.v=n;b.onclick=()=>{ST.n=n;render();};$("#nseg").appendChild(b);});
$("#step").onclick=()=>{ST.step++;render();};
$("#reset").onclick=()=>{ST.step=0;render();};
render();
autoStep($("#step"));
</script>
</body>
</html>
